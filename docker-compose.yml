secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  auth_secret:
    file: ./secrets/auth_secret
  auth_google_secret:
    file: ./secrets/auth_google_secret
  openai_api_key:
    file: ./secrets/openai_api_key
  database_url:
    file: ./secrets/database_url

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep '\"s3\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    # /run/secrets/ からファイルを読んで環境変数に変換してから起動
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >
        export JWT_SECRET=$(cat /run/secrets/jwt_secret);
        export OPENAI_API_KEY=$(cat /run/secrets/openai_api_key);
        export DATABASE_URL=$(cat /run/secrets/database_url);
        exec node dist/main
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_SSL: ${DATABASE_SSL}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      FRONTEND_URL: ${FRONTEND_URL}
    secrets:
      - jwt_secret
      - openai_api_key
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    # /run/secrets/ からファイルを読んで環境変数に変換してから起動
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >
        export AUTH_SECRET=$(cat /run/secrets/auth_secret);
        export AUTH_GOOGLE_SECRET=$(cat /run/secrets/auth_google_secret);
        export PORT=${FRONTEND_PORT};
        exec node server.js
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      AUTH_URL: ${AUTH_URL}
    secrets:
      - auth_secret
      - auth_google_secret
    depends_on:
      - backend

volumes:
  postgres_data:
  localstack_data:
