name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境'
        required: true
        type: choice
        options: [dev, prod]
      deploy_target:
        description: 'デプロイ対象'
        required: true
        type: choice
        options: [all, infra, apps]
        default: all

# reusable workflow が OIDC (id-token: write) を使うため、呼び出し側でも明示が必要
permissions:
  id-token: write
  contents: read

jobs:
  # 変更箇所の検知
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.result.outputs.infra }}
      apps:  ${{ steps.result.outputs.apps }}
      env:   ${{ steps.result.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      # push イベント時のみパスフィルターで変更検知
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            infra:
              - 'infra/**'
            apps:
              - 'apps/**'

      - name: Set outputs
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.deploy_target }}"
            echo "infra=$( [ "$TARGET" = "all" ] || [ "$TARGET" = "infra" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "apps=$( [ "$TARGET" = "all" ] || [ "$TARGET" = "apps" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "infra=${{ steps.filter.outputs.infra }}" >> "$GITHUB_OUTPUT"
            echo "apps=${{ steps.filter.outputs.apps }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "env=prod" >> "$GITHUB_OUTPUT"
            else
              echo "env=dev" >> "$GITHUB_OUTPUT"
            fi
          fi

  # インフラデプロイ - dev（infra/ に変更がある場合のみ）
  deploy-infra-dev:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true' && needs.detect-changes.outputs.env == 'dev'
    uses: ./.github/workflows/reusable-infra-deploy.yml
    with:
      environment: dev
    secrets:
      aws_account_id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}

  # インフラデプロイ - prod（infra/ に変更がある場合のみ）
  deploy-infra-prod:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true' && needs.detect-changes.outputs.env == 'prod'
    uses: ./.github/workflows/reusable-infra-deploy.yml
    with:
      environment: prod
    secrets:
      aws_account_id: ${{ secrets.PROD_AWS_ACCOUNT_ID }}

  # アプリデプロイ - dev（apps/ に変更がある場合のみ、infra デプロイの後に実行）
  deploy-app-dev:
    needs: [detect-changes, deploy-infra-dev]
    if: |
      always() &&
      needs.detect-changes.outputs.apps == 'true' &&
      needs.detect-changes.outputs.env == 'dev' &&
      (needs.deploy-infra-dev.result == 'success' || needs.deploy-infra-dev.result == 'skipped')
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: dev
    secrets:
      aws_account_id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}

  # アプリデプロイ - prod（apps/ に変更がある場合のみ、infra デプロイの後に実行）
  deploy-app-prod:
    needs: [detect-changes, deploy-infra-prod]
    if: |
      always() &&
      needs.detect-changes.outputs.apps == 'true' &&
      needs.detect-changes.outputs.env == 'prod' &&
      (needs.deploy-infra-prod.result == 'success' || needs.deploy-infra-prod.result == 'skipped')
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: prod
    secrets:
      aws_account_id: ${{ secrets.PROD_AWS_ACCOUNT_ID }}
